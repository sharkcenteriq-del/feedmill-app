name: Build apps
on: { push: { branches: [main, master] }, workflow_dispatch: {} }
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: Windows-Installer, path: dist/*.exe }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run prepare-www
      - run: npx cap add android
      - run: mkdir -p assets && cp icon.png assets/icon.png && convert -size 2732x2732 xc:'#1F3B2E' assets/splash.png
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#1F3B2E' --iconBackgroundColorDark '#1F3B2E' --splashBackgroundColor '#1F3B2E' --splashBackgroundColorDark '#1F3B2E'
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: Android-APK, path: android/app/build/outputs/apk/debug/app-debug.apk }
